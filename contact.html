<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Набор инструментов</title>
        <link rel="stylesheet" href="css/contact.css" type="text/css">
    </head>
    <body>
        <div class="wrap">
            <div class="aside">
                <a href="index.html">
                    <div class="avatar"></div>
                </a>
                <div class="status">                    
                    ⦿ Готов к работе                    
                </div>
                <div class="nav-wrap">
                    <a href="index.html" class="nav-button">Главная</a>
                    <a href="about.html" class="nav-button">Обо мне</a>
                    <a href="projects.html" class="nav-button">Проекты</a>
                    <a href="stack.html" class="nav-button">Навыки</a>
                    <a href="contact.html" class="nav-button-active">Контакты</a>
                </div>
            </div>
            <div class="aside-copy"></div>
            <div class="content">
                <div class="title">
                    <h1>Давайте свяжемся</h1>
                </div>
                <div class="projects">
                    <form>
                        <fieldset class="contact-fieldset">
                            <div class="inputfields">
                                <legend class="contact-legend">Напишите мне</legend>
                                <div class="contact-form-wrap">
                                    <div class="form-group">
                                        <input class="contact-input title-input" type="text" placeholder="Ваше имя" required>
                                        <input class="contact-input title-input last" type="text" placeholder="Ваш email" required>
                                    </div>
                                    <div class="form-group">    
                                        <textarea class="contact-input message-input" type="text" placeholder="Напишите сообщение..." required></textarea>   
                                    </div>
                                    <button type="submit" class="contact-button">Отправить сообщение</button>
                                </div>
                            </div>
                        </fieldset>
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
